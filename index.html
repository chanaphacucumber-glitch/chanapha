
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แนะนำตัวเอง | แตงกวา</title>

    <link href="https://fonts.googleapis.com/css2?family=Charm&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Charm', cursive;
            background: linear-gradient(135deg, #e0c3fc, #8ec5fc);
            color: #4b3f72;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            max-width: 420px;
            width: 100%;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px #6c63a033;
        }

        .profile {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #e0c3fc;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 32px;
            color: #8e44ad;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            margin: 10px 0;
        }

        .skill {
            background: #f3e8ff;
            padding: 12px;
            border-radius: 15px;
            margin-top: 15px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            background: #b28dff;
            color: white;
            font-family: inherit;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #8e44ad;
        }
    </style>
</head>

<body>
    <div class="card">
        <img class="profile"
             src="https://placehold.co/300x300/e0c3fc/8e44ad?text=My+Photo"
             alt="S__2826251">

        <h1>สวัสดีค่ะ! 🌷</h1>
        <h1>ฉันชื่อ แตงกวา</h1>

        <p>🎓 กำลังศึกษาอยู่ที่วิทยาลัยเทคนิคสิงห์บุรี</p>
        <p>💻 แผนกเทคโนโลยีสารสนเทศ</p>
        <p>📚 ระดับชั้น ปวช. 2/2</p>

        <div class="skill">
            <p>✨ ความสามารถ</p>
            <p>เขียนโค้ดเว็บไซต์ และตัดต่อวิดีโอ</p>
        </div>

        <button onclick="showMessage()">
            กดตรงนี้ 💖
        </button>

        <p id="message"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "ยินดีที่ได้รู้จักนะคะ 🌸";
        }
    </script>
</body>
</html>
